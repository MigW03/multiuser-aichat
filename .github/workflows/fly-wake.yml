# Wakes the Fly machine in the morning. The night stop (and the main 06:00 start) are two cron-job.org jobs that call
# the Fly Machines API; see "Night shutdown" in the README. This workflow is the backup start (06:10 Brasília, UTC-3,
# no daylight saving) and a manual start/stop button. GitHub cron is UTC and can start minutes late; starting a machine
# that is already running does nothing.
name: fly-wake

on:
  schedule:
    - cron: "10 9 * * *"   # 06:10 BRT: start
  workflow_dispatch:
    inputs:
      action:
        description: Run by hand
        type: choice
        options: [start, stop]
        required: true

permissions: {}

concurrency: fly-wake

jobs:
  toggle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      ACTION: ${{ inputs.action || 'start' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          sparse-checkout: fly.toml
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5
      - name: ${{ env.ACTION }} the server machine
        run: |
          set -euo pipefail
          # Until the Fly app and this secret exist, the daily run should not fail.
          if [ -z "${FLY_API_TOKEN:-}" ] && [ "${{ github.event_name }}" = schedule ]; then echo "FLY_API_TOKEN not set, skipping"; exit 0; fi
          app=$(sed -n 's/^app = "\([^"]*\)".*/\1/p' fly.toml)
          ids=$(flyctl machine list --app "$app" --json | jq -r '.[].id')
          [ -n "$ids" ] || { echo "no machines found for $app"; exit 1; }
          for id in $ids; do
            flyctl machine "$ACTION" "$id" --app "$app" --wait-timeout 60s
          done
