# Fly.io config for the chat server (server/). Deploy from the repo root: fly deploy
# Never run more than one machine: the run queue and rate limits live in this process's memory.
app = "multiuser-chat-server"   # change if the name is taken: names are global on Fly
primary_region = "gru"          # São Paulo

[build]
  dockerfile = "server/Dockerfile"

[deploy]
  strategy = "immediate"        # replace the single machine in place; never start a second one

[env]
  PORT = "8080"
  HOST = "0.0.0.0"
  TRUST_PROXY = "1"             # Fly's proxy sets X-Forwarded-For, so rate limits see the real client
  # Secrets (set with `fly secrets set`, see README): SUPABASE_URL, SUPABASE_SECRET_KEY, KEY_ENCRYPTION_SECRET,
  # ALLOWED_ORIGINS, APP_URL, and optionally RESEND_API_KEY + MAIL_FROM.

[http_service]
  internal_port = 8080
  force_https = true
  # The machine is stopped on a schedule (cron-job.org, see README "Night shutdown"). Auto-start must stay off,
  # or the first request at night would wake it and the schedule would save nothing.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
