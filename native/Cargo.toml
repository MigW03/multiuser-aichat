[package]
name = "multiuser-chat"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[[bin]]
name = "multiuser-chat"
path = "src/main.rs"

[dependencies]
# Pinned exactly: GPUI's pre-1.0 API changes between releases.
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dotenvy = "0.15"
anyhow = "1"
unicode-segmentation = "1"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

# On macOS, compile Metal shaders at startup so building does not need the full Xcode app.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "runtime_shaders"] }

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["font-kit", "windows-manifest"] }
